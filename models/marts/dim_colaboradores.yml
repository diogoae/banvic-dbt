models:
  - name: dim_colaboradores
    description: Tabela dimensão com dados dos colaboradores PF/PJ do Banvic
    columns:
      - name: pk_colaborador
        description: Chave primária do cadastro de colaboradores
      - name: nome_colaborador
        description: Nome do colaborador
      - name: email_colaborador
        description: Email do colaborador
      - name: cpf_colaborador
        description: Documento do colaborador (CPF)
      - name: data_nascimento_colaborador
        description: Data de nascimento do colaborador
      - name: endereco_colaborador
        description: Endereço do colaborador
      - name: cep_colaborador
        description: CEP do colaborador
      - name: cidade_colaborador
        description: Cidade do colaborador
      - name: uf_colaborador
        description: UF do colaborador

sources:
  - name: erp
    description: Dados de origem do ERP da Banvic, com tabelas de clientes, colaboradores, contas e transações.
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidade com informações de cidade e estado.
        columns:
          - name: cod_localidade
            description: Chave primaria da tabela localidades.
            data_tests:
              - unique
              - not_null              
      - name: clientes
        description: Tabela fonte de clientes com informações pessoais dos clientes Banvic.
        columns:
          - name: cod_cliente
            description: Chave primaria da tabela clientes.
            data_tests:
              - unique
              - not_null
      - name: agencias
        description: Tabela fonte de agencias do Banvic.
        columns:
          - name: cod_agencia
            description: Chave primaria da tabela agencias.
            data_tests:
              - unique
              - not_null
      - name: colaboradores
        description: Tabela fonte de colaboradores do Banvic.
        columns:
          - name: cod_colaborador
            description: Chave primaria da tabela colaboradors.
            data_tests:
              - unique
              - not_null      
      - name: colaborador_agencia
        description: Relacionamento colaborador x agencia
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - cod_colaborador
                  - cod_agencia      
      - name: contas
        description: Tabela de informações das contas bancárias dos clientes
        columns:
          - name: num_conta
            description: Chave primária da tabela de cadastro de contas
            data_tests:
              - unique
              - not_null              
      - name: propostas_credito
        description: Tabela de propostas de credito feitas aos clientes
        columns:
          - name: cod_proposta
            description: Chave primária da tabela de propostas de credito
            data_tests:
              - unique
              - not_null              
      - name: transacoes
        description: Tabela de transações financeiras
        columns:
          - name: cod_transacao
            description: Chave primária da tabela de transacoes
            data_tests:
              - unique
              - not_null